<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dochádzka</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<!-- QR skener a export do Excelu -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
  :root{
    --bg: #0F1720;
    --panel: #17222D;
    --panel-2: #1D2A37;
    --border: rgba(255,255,255,0.08);
    --text: #ECEFF2;
    --muted: #8A98A6;
    --amber: #E7A23B;
    --green: #4EA97C;
    --green-bg: rgba(78,169,124,0.14);
    --red: #D9695A;
    --red-bg: rgba(217,105,90,0.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding:28px 16px 60px;
  }
  .wrap{max-width:720px;margin:0 auto;}

  header{margin-bottom:22px;}
  .eyebrow{color:var(--amber);font-size:14px;font-weight:600;letter-spacing:0.02em;margin:0 0 4px;}
  h1{
    font-family:'Space Grotesk',sans-serif;
    font-size:32px;font-weight:700;margin:0 0 6px;
    letter-spacing:-0.01em;
  }
  .clock{font-family:'Space Grotesk',sans-serif;color:var(--muted);font-size:15px;}

  .status{
    display:inline-flex;align-items:center;gap:7px;
    font-size:13px;color:var(--muted);margin-top:8px;
  }
  .status .dot{width:8px;height:8px;border-radius:50%;background:var(--muted);}
  .status.online .dot{background:var(--green);}
  .status.error .dot{background:var(--red);}

  .panel{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    padding:22px;
    margin-bottom:18px;
  }

  .scan-row{display:flex;gap:10px;}
  #reader{
    width:100%;
    border-radius:10px;
    overflow:hidden;
    margin-top:14px;
    display:none;
    border:1px solid var(--border);
  }
  #reader.active{display:block;}

  .cam-switch-row{
    display:none;justify-content:center;margin-top:10px;
  }
  .cam-switch-row.active{display:flex;}

  button{
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:15px;
    border-radius:9px;
    border:1px solid var(--border);
    padding:13px 18px;
    cursor:pointer;
    background:var(--panel-2);
    color:var(--text);
    transition:transform 0.08s ease, background 0.15s ease;
  }
  button:hover{background:#233242;}
  button:active{transform:scale(0.98);}
  button:disabled{opacity:0.45;cursor:default;}

  .btn-in{background:var(--green);color:#08160F;border-color:transparent;}
  .btn-in:hover{background:#5cbd8c;}
  .btn-out{background:var(--amber);color:#211404;border-color:transparent;}
  .btn-out:hover{background:#f0ad4d;}
  .btn-switch{font-size:13px;padding:9px 16px;}

  .hint{color:var(--muted);font-size:13px;margin-top:10px;line-height:1.5;}

  .feedback{
    margin-top:16px;padding:14px 16px;border-radius:10px;
    font-size:15px;font-weight:600;display:none;
  }
  .feedback.show{display:block;}
  .feedback.ok-in{background:var(--green-bg);color:var(--green);}
  .feedback.ok-out{background:rgba(231,162,59,0.14);color:var(--amber);}
  .feedback.err{background:var(--red-bg);color:var(--red);}

  .day-head{
    display:flex;align-items:center;justify-content:space-between;
    gap:10px;flex-wrap:wrap;margin-bottom:14px;
  }
  .day-head h2{font-family:'Space Grotesk',sans-serif;font-size:19px;margin:0;font-weight:600;}
  .day-nav{display:flex;align-items:center;gap:8px;}
  .day-nav input[type=date]{
    background:var(--panel-2);color:var(--text);
    border:1px solid var(--border);border-radius:8px;
    padding:8px 10px;font-family:'Inter',sans-serif;font-size:14px;
  }
  .day-nav button{padding:8px 12px;font-size:14px;}

  table{width:100%;border-collapse:collapse;font-size:14px;}
  th{
    text-align:left;color:var(--muted);font-weight:600;
    font-size:12px;padding:8px 10px;border-bottom:1px solid var(--border);
  }
  td{padding:10px;border-bottom:1px solid var(--border);}
  tr:last-child td{border-bottom:none;}
  .running{color:var(--amber);}
  .empty-row td{color:var(--muted);text-align:center;padding:26px 10px;}
  .id-cell{font-family:'Space Grotesk',sans-serif;font-weight:600;}
  .del-btn{background:none;border:none;color:var(--muted);font-size:16px;padding:2px 6px;cursor:pointer;}
  .del-btn:hover{color:var(--red);}

  .totals{margin-top:14px;border-top:1px solid var(--border);padding-top:12px;}
  .totals-row{display:flex;justify-content:space-between;font-size:14px;padding:4px 2px;color:var(--muted);}
  .totals-row b{color:var(--text);}

  .export-row{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;}

  @media (max-width:480px){
    h1{font-size:26px;}
    .scan-row{flex-direction:column;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <p class="eyebrow">Dochádzkový terminál</p>
    <h1>Dochádzka</h1>
    <div class="clock" id="clock">—</div>
    <div class="status" id="status"><span class="dot"></span><span id="statusText">Pripájam sa na server…</span></div>
  </header>

  <section class="panel">
    <div class="scan-row">
      <button class="btn-in" id="scanInBtn" style="flex:1;" disabled>Naskenovať príchod</button>
      <button class="btn-out" id="scanOutBtn" style="flex:1;" disabled>Naskenovať odchod</button>
    </div>
    <div id="reader"></div>
    <div class="cam-switch-row" id="camSwitchRow">
      <button class="btn-switch" id="camSwitchBtn">Prepnúť kameru (predná / zadná)</button>
    </div>
    <p class="hint">Vyber, či ide o príchod alebo odchod, potom namier kameru na QR kód na karte. Kamera vyžaduje HTTPS a povolenie prehliadača.</p>

    <div class="feedback" id="feedback"></div>
  </section>

  <section class="panel">
    <div class="day-head">
      <h2 id="dayTitle">Dnešný deň</h2>
      <div class="day-nav">
        <button id="prevDay">←</button>
        <input type="date" id="dateInput">
        <button id="nextDay">→</button>
      </div>
    </div>

    <table>
      <thead>
        <tr><th>ID karty</th><th>Príchod</th><th>Odchod</th><th>Odpracované</th><th></th></tr>
      </thead>
      <tbody id="tableBody">
        <tr class="empty-row"><td colspan="5">Načítavam…</td></tr>
      </tbody>
    </table>

    <div class="totals" id="totals"></div>

    <div class="export-row">
      <button id="exportDay">Exportovať tento deň (Excel)</button>
      <button id="exportAll">Exportovať všetko (Excel)</button>
    </div>
  </section>

</div>

<script>
/* =========================================================================
   1) FIREBASE KONFIGURÁCIA
   Nahraď tento objekt configom z tvojho Firebase projektu:
   Firebase Console -> Project settings -> Your apps -> Web app -> SDK setup
   ========================================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyD4AHmXe-dZvQL6Za_PdZUzQ29kf-rnT2o",
  authDomain: "dochadzka-odstavky.firebaseapp.com",
  projectId: "dochadzka-odstavky",
  storageBucket: "dochadzka-odstavky.firebasestorage.app",
  messagingSenderId: "408796583756",
  appId: "1:408796583756:web:b608d4ff4bb870c620a1e9"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();
const COLLECTION = "dochadzka";

// ---- stav / status indikátor ----
const statusEl = document.getElementById('status');
const statusText = document.getElementById('statusText');
function setStatus(kind, text){
  statusEl.className = 'status ' + kind;
  statusText.textContent = text;
}

let isReady = false;
auth.signInAnonymously().catch(err => {
  console.error(err);
  setStatus('error', 'Nepodarilo sa pripojiť (skontroluj Firebase config a internet).');
});
auth.onAuthStateChanged(user => {
  if(user){
    isReady = true;
    setStatus('online', 'Pripojené');
    document.getElementById('scanInBtn').disabled = false;
    document.getElementById('scanOutBtn').disabled = false;
  }
});

// ---- pomocné funkcie ----
function localDateKey(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function fmtTime(iso){ return new Date(iso).toLocaleTimeString('sk-SK',{hour:'2-digit',minute:'2-digit'}); }
function fmtDuration(mins){
  const h = Math.floor(mins/60), m = Math.round(mins%60);
  return `${h} h ${m} min`;
}
function fmtDateHuman(dateKey){
  const [y,m,d] = dateKey.split('-');
  return new Date(+y,+m-1,+d).toLocaleDateString('sk-SK',{weekday:'long', day:'numeric', month:'long', year:'numeric'});
}

// ---- hodiny ----
function tickClock(){
  document.getElementById('clock').textContent = new Date().toLocaleString('sk-SK',{
    weekday:'short', day:'numeric', month:'numeric', year:'numeric', hour:'2-digit', minute:'2-digit', second:'2-digit'
  });
}
setInterval(tickClock, 1000);
tickClock();

// ---- feedback banner ----
function showFeedback(type, text){
  const el = document.getElementById('feedback');
  el.className = 'feedback show ' + type;
  el.textContent = text;
}
function hideFeedback(){ document.getElementById('feedback').className = 'feedback'; }

// =========================================================================
// 2) ZÁPIS PRÍCHODU / ODCHODU (atomicky cez Firestore transakciu)
// =========================================================================
async function processId(rawId, mode){
  const id = (rawId || '').trim();
  if(!id){ showFeedback('err', 'Kód sa nepodarilo prečítať, skús to znova.'); return; }
  if(!isReady){ showFeedback('err', 'Ešte nie je pripojenie na server pripravené, skús o chvíľu.'); return; }

  const now = new Date();
  const dateKey = localDateKey(now);
  const docRef = db.collection(COLLECTION).doc(dateKey);

  let resultType = null, resultMsg = null;
  try{
    await db.runTransaction(async (tx) => {
      const snap = await tx.get(docRef);
      const record = snap.exists ? snap.data() : {};
      const sessions = record[id] || [];
      const last = sessions[sessions.length - 1];

      if(mode === 'prichod'){
        if(last && !last.odchod){
          resultType = 'err';
          resultMsg = `ID ${id} má dnes už zaznamenaný príchod o ${fmtTime(last.prichod)} bez odchodu.`;
          return;
        }
        sessions.push({ prichod: now.toISOString(), odchod: null });
        resultType = 'ok-in';
        resultMsg = `Príchod zaznamenaný pre ID ${id} o ${fmtTime(now.toISOString())}.`;
      } else {
        if(!last || last.odchod){
          resultType = 'err';
          resultMsg = `Pre ID ${id} nie je dnes zaznamenaný otvorený príchod.`;
          return;
        }
        last.odchod = now.toISOString();
        const mins = (new Date(last.odchod) - new Date(last.prichod)) / 60000;
        resultType = 'ok-out';
        resultMsg = `Odchod zaznamenaný pre ID ${id} o ${fmtTime(last.odchod)}. Odpracoval ${fmtDuration(mins)}.`;
      }
      record[id] = sessions;
      tx.set(docRef, record);
    });
    showFeedback(resultType, resultMsg);
  }catch(err){
    console.error(err);
    showFeedback('err', 'Nepodarilo sa uložiť záznam (skontroluj internetové pripojenie).');
  }
}

// =========================================================================
// 3) KAMERA — skenovanie + prepínanie prednej/zadnej kamery
// =========================================================================
const scanInBtn = document.getElementById('scanInBtn');
const scanOutBtn = document.getElementById('scanOutBtn');
const readerDiv = document.getElementById('reader');
const camSwitchRow = document.getElementById('camSwitchRow');
const camSwitchBtn = document.getElementById('camSwitchBtn');

let html5QrCode = null;
let scanning = false;
let activeMode = null;
let cameras = [];
let cameraIndex = 0;

async function ensureCameras(){
  if(cameras.length) return cameras;
  try{
    cameras = await Html5Qrcode.getCameras();
    const backIdx = cameras.findIndex(c => /back|rear|zadn|environment/i.test(c.label));
    if(backIdx >= 0) cameraIndex = backIdx;
  }catch(e){
    cameras = [];
  }
  camSwitchRow.classList.toggle('active', cameras.length > 1);
  return cameras;
}
function currentCameraConfig(){
  if(cameras.length) return { deviceId: { exact: cameras[cameraIndex].id } };
  return { facingMode: "environment" };
}

function resetScanButtons(){
  scanInBtn.textContent = 'Naskenovať príchod';
  scanOutBtn.textContent = 'Naskenovať odchod';
  scanInBtn.disabled = !isReady;
  scanOutBtn.disabled = !isReady;
}

async function stopScan(){
  if(html5QrCode && scanning){
    try{ await html5QrCode.stop(); }catch(e){}
  }
  readerDiv.classList.remove('active');
  scanning = false;
  activeMode = null;
  resetScanButtons();
}

async function startScan(mode){
  if(!isReady) return;
  if(scanning){
    const wasMode = activeMode;
    await stopScan();
    if(wasMode === mode) return; // druhé kliknutie na to isté tlačidlo = zastaviť
  }
  await ensureCameras();

  activeMode = mode;
  hideFeedback();
  readerDiv.classList.add('active');
  scanning = true;

  const btn = mode === 'prichod' ? scanInBtn : scanOutBtn;
  const otherBtn = mode === 'prichod' ? scanOutBtn : scanInBtn;
  btn.textContent = 'Zastaviť skenovanie';
  otherBtn.disabled = true;

  try{
    html5QrCode = new Html5Qrcode("reader");
    await html5QrCode.start(
      currentCameraConfig(),
      { fps: 10, qrbox: 240 },
      async (decodedText) => {
        const usedMode = activeMode;
        await stopScan();
        await processId(decodedText, usedMode);
      },
      () => { /* ignorovať snímky bez kódu */ }
    );
  }catch(err){
    await stopScan();
    showFeedback('err', 'Kameru sa nepodarilo spustiť. Skontroluj povolenia prehliadača pre kameru.');
  }
}

scanInBtn.addEventListener('click', () => startScan('prichod'));
scanOutBtn.addEventListener('click', () => startScan('odchod'));

camSwitchBtn.addEventListener('click', async () => {
  if(cameras.length < 2) return;
  cameraIndex = (cameraIndex + 1) % cameras.length;
  if(scanning){
    const mode = activeMode;
    await stopScan();
    await startScan(mode);
  }
});

// =========================================================================
// 4) DENNÝ PREHĽAD — živé sledovanie dát z Firestore (onSnapshot)
// =========================================================================
let currentDate = localDateKey(new Date());
let currentRecordCache = {};
let unsubscribeDay = null;

function watchDate(dateKey){
  if(unsubscribeDay) unsubscribeDay();
  currentDate = dateKey;
  document.getElementById('dateInput').value = dateKey;
  const today = localDateKey(new Date());
  document.getElementById('dayTitle').textContent =
    (dateKey === today ? 'Dnešný deň — ' : '') + fmtDateHuman(dateKey);

  unsubscribeDay = db.collection(COLLECTION).doc(dateKey).onSnapshot(
    snap => {
      currentRecordCache = snap.exists ? snap.data() : {};
      renderTable(currentRecordCache);
    },
    err => {
      console.error(err);
      setStatus('error', 'Chyba pri načítaní dát.');
    }
  );
}

function renderTable(record){
  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = '';

  const rows = [];
  Object.keys(record).forEach(id => {
    record[id].forEach((s, idx) => rows.push({ id, idx, ...s }));
  });
  rows.sort((a,b) => new Date(a.prichod) - new Date(b.prichod));

  if(rows.length === 0){
    tbody.innerHTML = '<tr class="empty-row"><td colspan="5">Zatiaľ žiadne záznamy pre tento deň.</td></tr>';
  } else {
    rows.forEach(r => {
      const tr = document.createElement('tr');
      const mins = r.odchod ? (new Date(r.odchod) - new Date(r.prichod)) / 60000 : null;
      tr.innerHTML = `
        <td class="id-cell">${r.id}</td>
        <td>${fmtTime(r.prichod)}</td>
        <td>${r.odchod ? fmtTime(r.odchod) : '<span class="running">prebieha</span>'}</td>
        <td>${mins !== null ? fmtDuration(mins) : '—'}</td>
        <td><button class="del-btn" title="Zmazať záznam" data-id="${r.id}" data-idx="${r.idx}">×</button></td>
      `;
      tbody.appendChild(tr);
    });
  }

  const totalsDiv = document.getElementById('totals');
  totalsDiv.innerHTML = '';
  Object.keys(record).sort().forEach(id => {
    const completedMins = record[id]
      .filter(s => s.odchod)
      .reduce((sum, s) => sum + (new Date(s.odchod) - new Date(s.prichod)) / 60000, 0);
    const hasRunning = record[id].some(s => !s.odchod);
    const row = document.createElement('div');
    row.className = 'totals-row';
    row.innerHTML = `<span>ID ${id}${hasRunning ? ' (stále v práci)' : ''}</span><b>${fmtDuration(completedMins)}</b>`;
    totalsDiv.appendChild(row);
  });

  tbody.querySelectorAll('.del-btn').forEach(b => {
    b.addEventListener('click', async () => {
      if(!confirm('Zmazať tento záznam?')) return;
      const id = b.dataset.id, idx = +b.dataset.idx;
      const rec = JSON.parse(JSON.stringify(currentRecordCache));
      rec[id].splice(idx, 1);
      if(rec[id].length === 0) delete rec[id];
      try{
        await db.collection(COLLECTION).doc(currentDate).set(rec);
      }catch(err){
        console.error(err);
        alert('Zmazanie sa nepodarilo, skús znova.');
      }
    });
  });
}

document.getElementById('dateInput').addEventListener('change', (e) => watchDate(e.target.value));
document.getElementById('prevDay').addEventListener('click', () => {
  const d = new Date(currentDate + 'T00:00:00');
  d.setDate(d.getDate() - 1);
  watchDate(localDateKey(d));
});
document.getElementById('nextDay').addEventListener('click', () => {
  const d = new Date(currentDate + 'T00:00:00');
  d.setDate(d.getDate() + 1);
  watchDate(localDateKey(d));
});

// =========================================================================
// 5) EXPORT DO EXCELU
// =========================================================================
function recordToRows(dateKey, record){
  const rows = [];
  Object.keys(record).sort().forEach(id => {
    record[id].forEach(s => {
      const mins = s.odchod ? (new Date(s.odchod) - new Date(s.prichod)) / 60000 : null;
      rows.push({
        'Dátum': dateKey,
        'ID karty': id,
        'Príchod': fmtTime(s.prichod),
        'Odchod': s.odchod ? fmtTime(s.odchod) : 'prebieha',
        'Odpracované (hod)': mins !== null ? +(mins/60).toFixed(2) : ''
      });
    });
  });
  return rows;
}

document.getElementById('exportDay').addEventListener('click', () => {
  const rows = recordToRows(currentDate, currentRecordCache);
  if(rows.length === 0){ alert('Pre tento deň nie sú žiadne záznamy.'); return; }
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, currentDate);
  XLSX.writeFile(wb, `dochadzka_${currentDate}.xlsx`);
});

document.getElementById('exportAll').addEventListener('click', async () => {
  try{
    const snap = await db.collection(COLLECTION).get();
    if(snap.empty){ alert('Zatiaľ nie sú žiadne uložené dáta.'); return; }
    let allRows = [];
    snap.forEach(doc => { allRows = allRows.concat(recordToRows(doc.id, doc.data())); });
    const ws = XLSX.utils.json_to_sheet(allRows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Dochádzka');
    XLSX.writeFile(wb, `dochadzka_vsetko.xlsx`);
  }catch(err){
    console.error(err);
    alert('Export sa nepodaril, skontroluj pripojenie.');
  }
});

// ---- štart ----
watchDate(currentDate);
</script>
</body>
</html>
